name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend - build y pruebas
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Obtener el codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Analisis estatico
        run: npm run lint -- --max-warnings=0
        continue-on-error: true

      - name: Compilar
        run: npm run build

      - name: Pruebas unitarias
        run: npm test -- --ci

  atm:
    name: ATM - verificacion de sintaxis
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: atm-client

    steps:
      - name: Obtener el codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verificar sintaxis de los archivos JavaScript
        run: |
          node --check js/api.js
          node --check js/app.js
          node --check config.js
          node --check server.js

      - name: Verificar que existan los archivos de la interfaz
        run: |
          test -f index.html
          test -f styles.css
